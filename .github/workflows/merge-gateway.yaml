# In August 2026, GitHub does still not have a way to require all running
# workflows to pass before enabling the merge-button, so use this workflow to
# wait on everything else,and put the branch-protection rules to wait for this
# workflow.
name: merge-gateway

on:
  workflow_call:
    inputs:
      timeout:
        description: "Timeout for the workflow"
        required: true
        type: number
    secrets:
      repo-token:
        description: "The GitHub token"
        required: true

permissions: {}

jobs:
  status-check:
    name: status-check
    timeout-minutes: ${{ inputs.timeout }}
    runs-on: ubuntu-26.04
    permissions:
      checks: read # Required for reading the status of other workflows.
    steps:
      - name: Wait for all workflows
        uses: matiasalbarello/wait-on-check-action-ts@8087812521cdb59ebc7751984b31b17209b30eeb # v1.2.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: "^.+$"
          repo-token: ${{ secrets.repo-token }}
          running-workflow-name: "merge-gateway / status-check"
