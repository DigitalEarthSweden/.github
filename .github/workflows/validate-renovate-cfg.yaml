name: Validate Renovate config

on:
  pull_request:
    paths: &paths
      - ".github/workflows/validate-renovate-cfg.yaml"
      - "default.json"
      - "preset.json5"
      - "renovate.json"
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

env:
  # renovate: datasource=docker depName=renovatebot/renovate packageName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.69.6@sha256:1f28f1c17ce62b079c6e2c4f3484f72c1147f0608d51b5ae1eaef992f7324d31

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-renovate-cfg:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          for config in default.json preset.json5; do
            docker run --rm -v \
              "$WORKSPACE:/workspace" \
              -w /workspace \
              ghcr.io/renovatebot/renovate:${RENOVATE_VERSION} \
              renovate-config-validator --strict \
              "$config"
          done
        env:
          WORKSPACE: ${{ github.workspace }}
